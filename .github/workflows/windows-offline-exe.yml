name: Windows Offline EXE
on:
  push:
    branches: [main]
    paths:
      - 'offline_launcher.py'
      - 'OFFLINE_KULLANIM.md'
      - '.github/workflows/windows-offline-exe.yml'
      - 'app.py'
      - 'requirements.txt'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    name: Build independent Windows executable
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name SayiKasifleri_Yerel --add-data "web;web" offline_launcher.py
          if (!(Test-Path 'dist/SayiKasifleri_Yerel.exe')) { throw "EXE generation failed." }
      - name: Windows runtime smoke test
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) 'dist/SayiKasifleri_Yerel.exe'
          $game = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i=0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              if ($game.HasExited) { throw "EXE exited early with code $($game.ExitCode)" }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 3
                if ($health.ok -eq $true) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw 'Windows EXE did not start server within 60 seconds.' }
            $home = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/' -UseBasicParsing -TimeoutSec 10
            if ($home.StatusCode -ne 200 -or $home.Content -notmatch 'Sayı Kâşifleri') {
              throw 'The executable started but did not serve the quiz homepage.'
            }
            Write-Host 'Windows EXE local server and homepage: OK'
          } finally {
            if ($game -and -not $game.HasExited) { Stop-Process -Id $game.Id -Force }
          }
      - name: Package EXE and teacher guide
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item dist/SayiKasifleri_Yerel.exe out/
          Copy-Item OFFLINE_KULLANIM.md out/
      - name: Publish downloadable EXE package
        uses: actions/upload-artifact@v4
        with:
          name: SayiKasifleri_Windows_Yerel_EXE
          path: out/*
          if-no-files-found: error
          retention-days: 90
