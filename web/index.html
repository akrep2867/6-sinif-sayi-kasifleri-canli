/* SAYI KÂŞİFLERİ: ARENA B / renkli canlı yarışma görünümü */
body.arena-mode{background:radial-gradient(circle at 3% 15%,#45259a 0,transparent 38%),radial-gradient(circle at 96% 30%,#154f8e 0,transparent 42%),radial-gradient(circle at 45% 97%,#3b2264 0,transparent 48%),#090e27}
body.arena-mode:before{opacity:.21;animation:starDrift 36s linear infinite}
body.arena-mode .head{border-bottom-color:#6b74d270}
body.arena-mode .logo .mark{animation:logoDance 4s ease-in-out infinite}
.game-box{isolation:isolate}
.game-box>*{position:relative;z-index:1}
.game-box .metric-card{border-color:#7d8cce7c;box-shadow:inset 0 1px #ffffff35,0 6px 24px #060a2470}
.game-box .metric-card:nth-child(1){background:linear-gradient(120deg,#3a236f,#392b8f)}
.game-box .metric-card:nth-child(2){background:linear-gradient(120deg,#0f4b79,#0d657c)}
.game-box .metric-card:nth-child(3){background:linear-gradient(120deg,#613268,#813d84)}
.question-panel{border:1px solid #8a80d56a;background:linear-gradient(150deg,#22205b,#101a3d 55%,#151534)}
.question-panel .question-banner{background:linear-gradient(90deg,#f4a934,#f3679b);color:#251537;border-color:#ffe0a5;box-shadow:0 5px 18px #ff76b330}
.answer{border:2px solid #ffffff3c;box-shadow:inset 0 2px #ffffff25,0 10px 25px #0003;text-shadow:0 1px #0004}
.answer:nth-child(4n+1){background:linear-gradient(120deg,#ef356a,#b52762)}
.answer:nth-child(4n+2){background:linear-gradient(120deg,#4286f6,#254fc2)}
.answer:nth-child(4n+3){background:linear-gradient(120deg,#fab843,#d77b18)}
.answer:nth-child(4n){background:linear-gradient(120deg,#38c99d,#138373)}
.answer .symbol{display:grid;place-items:center;width:50px;height:50px;flex:none;border-radius:15px;background:#00000026;font-size:27px;border:1px solid #ffffff35;box-shadow:inset 0 1px #ffffff35}
.answer:nth-child(4n+1) .symbol{transform:rotate(-6deg)}
.answer:nth-child(4n+2) .symbol{transform:rotate(5deg)}
.answer:nth-child(4n+3) .symbol{transform:rotate(-6deg)}
.answer:nth-child(4n+4) .symbol{transform:rotate(5deg)}
.answer:focus-visible{outline:3px solid #fff;outline-offset:4px}
.answer:hover:not(:disabled){filter:brightness(1.09)}
.answer.selected{border-color:#fff;filter:brightness(1.12);opacity:1!important}
.answer.correct{filter:brightness(1.15);opacity:1!important}
.answer.wrong{filter:saturate(.4);opacity:.4}
.game-box .qtext{text-wrap:balance;text-shadow:0 4px 28px #ae93ff33}
.metric-card strong{font-size:clamp(20px,2.8vw,31px)}
.timer-shell{background:conic-gradient(#ffca66 0 var(--p),#333c70 var(--p) 100%);filter:drop-shadow(0 0 20px #ffdb8133)}
.timer-shell.warn{background:conic-gradient(#ff5f83 0 var(--p),#333c70 var(--p) 100%);filter:drop-shadow(0 0 24px #ff5f8355)}
.game-box .inner,.game-box .mini-panel{border-color:#6e7bb66b}
.result-summary{box-shadow:0 8px 24px #0003}
.finish-header{text-align:center;padding:16px 10px 6px}
.finish-kicker{display:inline-block;border:1px solid #ffdb81aa;background:#443370;border-radius:30px;color:#ffe5a0;padding:8px 15px;font-size:12px;font-weight:1000;letter-spacing:2px}
.finish-title{font-weight:1000;letter-spacing:-1.5px;font-size:clamp(30px,5vw,54px);margin:12px 0 4px;background:linear-gradient(90deg,#fff5c3,#fface1,#bbdcff);background-clip:text;color:transparent}

<script>
(()=>{

const ESC=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const categoryLabel=c=>c.source==='custom'?'Öğretmenin Soruları':(({karisik:'Karışık Konular',carpan:'Çarpanlar',kat:'Katlar',asal:'Asal Sayılar'})[c.category]||'Karışık');
const medal=r=>r===1?'🥇':r===2?'🥈':r===3?'🥉':`${r}.`;

try{const saved=JSON.parse(localStorage.getItem('sk_teacher_questions_v1')||'[]');if(Array.isArray(saved))customQuestions=saved.slice(0,60).map(q=>q).filter(q=>q&&typeof q==='object')}catch{}
function playTone(freq=550,dur=.13,delay=0){if(!soundsOn)return;try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;if(!audioCtx)audioCtx=new Ctx();if(audioCtx.state==='suspended')audioCtx.resume();const at=audioCtx.currentTime+delay;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq,at);gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(.07,at+.02);gain.gain.exponentialRampToValueAtTime(.0001,at+dur);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(at);osc.stop(at+dur+.01);}catch{}}

function getStored(){try {return JSON.parse(sessionStorage.getItem('sk_canli_session')||'null');}catch{return null}}

function connect(){
  const proto=location.protocol==='https:'?'wss:':'ws:';
  ws=new WebSocket(`${proto}//${location.host}/ws`);
  ws.addEventListener('open',()=>{online=true;connDelay=1000;connStatus();if(room&&secret&&role)send({action:role==='host'?'host_resume':'resume',code:room,token:secret});});
  ws.addEventListener('close',()=>{online=false;connStatus();setTimeout(connect,connDelay);connDelay=Math.min(12000,connDelay*1.5);});
  ws.addEventListener('error',()=>{online=false;connStatus();});
  ws.addEventListener('message',ev=>{
   let v;try{v=JSON.parse(ev.data)}catch{return}
   if(v.type==='error'){error=v.message||'Bir sorun oluştu.';render();return}
   if(v.type==='notice'){error=v.text;render();return}
   if(v.type==='created'||v.type==='joined'){
     room=v.code;secret=v.token;role=v.type==='created'?'host':'player';ui='room';error='';saveStored();return;
   }
   if(v.type==='state'){clockSkew=Date.now()-(v.serverNow||Date.now());const prev=serverState;serverState=v;role=v.role;room=v.code;ui='room';error='';render();stateEffects(prev,v);}
  });

function connStatus(){document.getElementById('connection-dot').className='dot'+(online?' on':'');document.getElementById('connection-text').textContent=online?'Sunucuya bağlı':'Bağlantı bekleniyor';const create=app.querySelector('[data-click=create]');const join=app.querySelector('#join-form button[type=submit]');if(create)create.disabled=!online;if(join)join.disabled=!online;}
function send(obj){if(!ws||ws.readyState!==1){error='Bağlantı kesildi. İnternet veya Wi-Fi ağını kontrol edin.';render();return;}ws.send(JSON.stringify(obj));}

function validateTeacherQuestion(q){
 if(!q||typeof q.text!=='string'||q.text.trim().length<3||q.text.trim().length>280)throw Error('Soru metni 3–280 karakter olmalı.');
 if(!Array.isArray(q.options)||q.options.length!==4||q.options.some(x=>typeof x!=='string'||!x.trim()||x.trim().length>100))throw Error('Dört seçenek de dolu olmalı (en fazla 100 karakter).');
 if(new Set(q.options.map(x=>x.trim().toLocaleLowerCase('tr-TR'))).size!==4)throw Error('Dört seçenek birbirinden farklı olmalı.');
 if(!Number.isInteger(q.correct)||q.correct<0||q.correct>3)throw Error('Doğru şıkkı A, B, C veya D olarak işaretleyin.');
 if(typeof q.explain!=='string'||q.explain.trim().length>240)throw Error('Açıklama en fazla 240 karakter olmalı.');
 return {text:q.text.trim(),options:q.options.map(x=>x.trim()),correct:q.correct,explain:q.explain.trim()};
}

function parseTeacherCsv(raw){
 const txt=String(raw).replace(/^\uFEFF/,'');const header=txt.split(/\r?\n/,1)[0];
 const delim=header.split(';').length>=7?';':',';
 const rows=[],row=[];let cell='',quoted=false;
 for(let i=0;i<txt.length;i++){
  const c=txt[i];
  if(quoted){if(c==='"'&&txt[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}
  else if(c==='"')quoted=true;
  else if(c===delim){row.push(cell);cell=''}
  else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row.splice(0));cell=''}
  else cell+=c;
 }
 if(quoted)throw Error('CSV dosyasında kapanmamış tırnak var.');
 row.push(cell.replace(/\r$/,''));if(row.some(x=>x.trim()))rows.push(row);
 const normalized=x=>String(x).trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i').toLowerCase();
 const keys=['soru','a','b','c','d','dogru','aciklama'];
 const head=rows.shift();
 if(!head)throw Error('CSV dosyası boş.');
 const indices=keys.map(k=>head.findIndex(x=>normalized(x)===k));
 if(indices.slice(0,6).some(x=>x<0))throw Error('CSV başlıkları Soru;A;B;C;D;Dogru;Aciklama olmalı.');
 return rows.filter(r=>r.some(x=>x.trim())).map((r,i)=>{
  const get=j=>indices[j]<0?'':String(r[indices[j]]||'').trim();
  const label=get(5).toUpperCase();const correct=/^[ABCD]$/.test(label)?'ABCD'.indexOf(label):/^[1-4]$/.test(label)?Number(label)-1:-1;
  if(correct<0)throw Error((i+2)+'. satırın doğru cevabı A–D veya 1–4 olmalı.');
  return validateTeacherQuestion({text:get(0),options:[get(1),get(2),get(3),get(4)],correct,explain:get(6)});
 });
}
function downloadTeacherText(name,text,mime){
 const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),2000);
}
async function importTeacherFile(input){
 const file=input.files?.[0];if(!file)return;
 try{
  if(file.size>160000)throw Error('Dosya en fazla 160 KB olabilir.');
  const raw=await file.text();let incoming;
  if(/\.json$/i.test(file.name)){let decoded=JSON.parse(raw);if(!Array.isArray(decoded))throw Error('JSON dosyası soru dizisi olmalı.');incoming=decoded.map(validateTeacherQuestion);}
  else if(/\.csv$/i.test(file.name))incoming=parseTeacherCsv(raw);
  else throw Error('Yalnızca CSV veya JSON dosyası yükleyebilirsin.');
  if(!incoming.length)throw Error('Dosyada soru bulunamadı.');
  if(customQuestions.length+incoming.length>60)throw Error('Dosyadaki sorularla birlikte en fazla 60 soru olabilir.');
  customQuestions.push(...incoming);
  saveTeacherQuestions();renderTeacherBank();teacherMessage('✅ '+incoming.length+' soru yüklendi. Toplam: '+customQuestions.length+'.');
 }catch(e){teacherMessage('⚠️ Dosya yüklenemedi: '+e.message)}finally{input.value='';}
}

function answerProgress(s){const total=Math.max(1,s.playerCount||1),pct=Math.max(0,Math.min(100,Math.round(100*(s.answerCount||0)/total)));const doneAll=s.playerCount>0&&s.answerCount>=s.playerCount;return `<div class="answer-progress"><div class="answer-progress-top"><strong>⚡ Cevaplanma Hızı</strong><span>${doneAll?'Tüm oyuncular cevapladı!':`${s.answerCount}/${s.playerCount} oyuncu cevapladı`}</span></div><div class="answer-track" aria-hidden="true"><span style="width:${pct}%"></span></div></div>`}
function timerWidget(s){return `<div class="mini-panel"><div class="timer-stack"><div class="timer-shell" id="timer-shell" style="--p:100%"><div class="timer" id="timer">${s.config.seconds}</div></div><div class="timer-sub" id="timer-label">Süre akıyor</div></div></div>`}
function teacherQuestion(s){const q=s.question;const reveal=s.status==='reveal';const doneAll=s.playerCount>0&&s.answerCount>=s.playerCount;const statusLine=reveal?'Puanlar güncellendi. Hazırsan bir sonraki soruya geçebilirsin.':doneAll?'Tüm oyuncular cevap verdi. Sonuç ekranı hemen açılacak!':'Öğrenciler cevaplarını gönderiyor. İstersen cevabı manuel olarak da gösterebilirsin.';return `<div class="box game-box">${roomHeader(s)}<div class="metric-strip"><div class="metric-card"><small>🎯 Soru</small><strong>${q.number} / ${q.total}</strong></div><div class="metric-card"><small>📲 Cevap</small><strong>${s.answerCount} / ${s.playerCount}</strong></div><div class="metric-card"><small>🌐 Çevrimiçi</small><strong>${s.onlineCount}</strong></div></div><div class="stage-grid"><div class="question-panel"><div class="question-banner">${reveal?'✅ Sonuç açıklandı':'🚀 Canlı soru yayında'}</div>${reveal?'':`<div class="mobile-timer" id="mobile-timer">⏱ <span data-timer>${s.config.seconds}</span> sn</div>`}${reveal?'':answerProgress(s)}<div class="progress-line"><span style="width:${Math.round(100*(q.number-1)/q.total)}%"></span></div><h2 class="qtext">${ESC(q.text)}</h2>${answerOptions(s)}${reveal?`<div class="result-summary">✅ <strong>${ESC(q.options[q.correct])}</strong><div class="small-muted" style="color:inherit;margin-top:8px">${ESC(q.explain)}</div></div>`:`<div class="answer-info" style="color:var(--muted)">${doneAll?'✨ Tüm oyuncular cevapladı! Sonuç açılıyor...':'📱 Öğrenciler telefonlarından cevaplıyor...'}</div>`}</div><div class="side-panel">${reveal?`<div class="reveal-chip">✅ Cevap Açıklandı<small>${ESC(q.options[q.correct])}</small></div>`:timerWidget(s)}<div class="mini-panel"><h3>📣 Yarışma Durumu</h3><div class="status-line">${statusLine}</div><div class="score-note">${reveal?'Şimdi sıralama değişimlerini inceleyebilirsin.':'En hızlı doğru cevaplar daha yüksek puan kazandırır.'}</div></div><div class="mini-panel"><h3>🏆 Anlık Sıralama</h3>${scoresTable(s,reveal?7:5)}</div>${s.config.mode==='takim'?`<div class="mini-panel"><h3>🤝 Takım Puanları</h3>${teamsTable(s)}</div>`:''}</div></div><div class="actions">${reveal?`<button class="btn gold" data-click="next">${q.number===q.total?'🏆 SONUÇLARI GÖSTER':'➡️ SONRAKİ SORU'}</button>`:'<button class="btn dark" data-click="reveal">🔍 CEVABI GÖSTER</button>'}<button class="btn dark" data-click="end">🏁 YARIŞMAYI BİTİR</button></div></div>`}
function studentQuestion(s){const q=s.question,me=s.me||{},reveal=s.status==='reveal';const myteam=s.teams.find(t=>t.team===me.team);const myRank=s.players.find(p=>p.name===me.name)?.rank||'—';let top='';let statusLine='';if(reveal){const correct=me.answered&&me.choice===q.correct;top=`<div class="result-summary ${correct?'':'err'}">${correct?'🌟 Harika! Doğru cevap. +'+fmt(me.earned)+' puan':`📚 ${me.answered?'Bu kez olmadı.':'Süre doldu.'} Doğru cevap: ${ESC(q.options[q.correct])}`}<div class="small-muted" style="color:inherit;margin-top:8px">${ESC(q.explain)}</div></div>`;statusLine=correct?'Süper! Puanın güncellendi, sıradaki soruya hazır ol.':'Doğru cevabı incele ve bir sonraki soruya odaklan.'}else if(me.answered){top='<div class="result-summary center">✅ Cevabın kaydedildi! Herkes cevaplayınca sonuç hemen açılacak.</div>';statusLine='Cevabın güvenle gönderildi. Sonuç ekranı için diğer oyuncular bekleniyor.'}else statusLine='Seçeneğine dokun ve hızlı davran. En hızlı doğru cevaplar daha fazla puan getirir!';return `<div class="box game-box">${roomHeader(s)}<div class="metric-strip"><div class="metric-card"><small>🎯 Soru</small><strong>${q.number} / ${q.total}</strong></div><div class="metric-card"><small>⭐ Puanın</small><strong>${fmt(me.score)}</strong></div><div class="metric-card"><small>🏅 Sıralama</small><strong>${myRank}</strong></div></div><div class="stage-grid"><div class="question-panel"><div class="question-banner">${reveal?'📣 Sonuç ekranı':'🎮 Sıra sende!'}</div>${reveal?'':`<div class="mobile-timer" id="mobile-timer">⏱ <span data-timer>${s.config.seconds}</span> sn</div>`}${reveal?'':answerProgress(s)}<div class="progress-line"><span style="width:${Math.round(100*(q.number-1)/q.total)}%"></span></div><h2 class="qtext">${ESC(q.text)}</h2>${answerOptions(s)}${top}${reveal?`<div class="center small-muted">Öğretmen bir sonraki soruyu başlatacak.</div>`:me.answered?'':`<p class="small-muted center">Hızlı ve doğru cevapla: 1000 puan + en fazla 500 hız bonusu!</p>`}${myteam?`<p class="small-muted center">🤝 ${ESC(myteam.name)}</p>`:''}</div><div class="side-panel">${reveal?`<div class="reveal-chip">${me.answered&&me.choice===q.correct?'🌟 +'+fmt(me.earned)+' Puan':'📘 Sonuç'}<small>${me.answered&&me.choice===q.correct?'Mükemmel cevap!':'Doğru cevabı incele'}</small></div>`:timerWidget(s)}<div class="mini-panel"><h3>📣 Durumun</h3><div class="status-line">${statusLine}</div><div class="score-note">${me.answered&&!reveal?'Diğer oyuncular da cevap verince süre bitmeden sonraki aşamaya geçilir.':'Ritmi yakala ve sıralamada yüksel!'}</div></div><div class="mini-panel"><h3>🏆 Anlık Sıralama</h3>${scoresTable(s,5)}</div></div></div></div>`}
function winnersPodium(s){const team=s.config.mode==='takim';const participants=team?s.teams:s.players;const ranks=[1,0,2],avatars=['🥇','🥈','🥉'];return `<div class="podium" aria-label="İlk üç derece">${ranks.map(index=>{const p=participants[index];const rank=index+1;return `<div class="podium-item place-${rank}">${p?`<div class="podium-avatar">${avatars[index]}</div><div class="podium-name">${ESC(p.name)}</div><div class="podium-score">${fmt(p.score)} puan</div>`:`<div class="podium-name podium-empty">—</div>`}<div class="podium-block">${rank}</div></div>`}).join('')}</div>`}
function finalScreen(s){const me=s.me,myRank=me?s.players.find(p=>p.name===me.name)?.rank:null;return `<div class="box game-box">${roomHeader(s)}<div class="finish-header"><div class="finish-kicker">✨ BÜYÜK FİNAL ✨</div><h2 class="finish-title">🏆 ${s.config.mode==='takim'?'Şampiyon Takım Belli!':'Matematik Şampiyonları!'}</h2><p class="subtitle">${s.config.count} soru tamamlandı. Alkışlar bütün Sayı Kâşifleri'ne!</p>${me?`<div class="message">🌟 ${ESC(me.name)} · ${myRank}. sıra · <strong>${fmt(me.score)} puan</strong></div>`:''}</div>${winnersPodium(s)}<div class="${s.config.mode==='takim'?'two-cols':''}"><div class="inner"><h3>🥇 Bireysel Sıralama</h3>${scoresTable(s)}</div>${s.config.mode==='takim'?`<div class="inner"><h3>🤝 Takım Sıralaması</h3>${teamsTable(s)}</div>`:''}</div>${s.role==='host'?`<div class="actions"><button class="btn gold" data-click="reset">🔄 YENİDEN OYNA</button><button class="btn dark" data-click="csv">📊 SONUÇLARI CSV AL</button><button class="btn dark" data-click="home">🏠 ANA SAYFA</button></div>`:'<p class="small-muted center">Yeniden oynamak için öğretmeninin yeni tur başlatmasını bekle.</p>'}</div>`}
function renderRoom(s){if(s.status==='lobby')app.innerHTML=`<section class="section wide">${s.role==='host'?lobbyTeacher(s):lobbyStudent(s)}</section>`;
else if(s.status==='question'||s.status==='reveal')app.innerHTML=`<section class="section wide">${s.role==='host'?teacherQuestion(s):studentQuestion(s)}</section>`;
else app.innerHTML=`<section class="section wide">${finalScreen(s)}</section>`;
if(error)app.insertAdjacentHTML('afterbegin',alertHTML());
updateTimer();}
function render(){if(ui!=='room')document.body.classList.remove('arena-mode');if(ui==='home')renderHome();else if(ui==='create')renderSetup();else if(ui==='join')renderJoin();else if(serverState)renderRoom(serverState);else {ui='home';renderHome();}}
function updateTimer(){if(!serverState||serverState.status!=='question'||!serverState.question)return;const el=document.getElementById('timer');if(!el)return;const shell=document.getElementById('timer-shell');const label=document.getElementById('timer-label');const remainMs=Math.max(0,serverState.question.deadline-(Date.now()-clockSkew));const totalMs=Math.max(1000,(serverState.config?.seconds||1)*1000);const left=Math.max(0,Math.ceil(remainMs/1000));const pct=Math.max(0,Math.min(100,remainMs/totalMs*100));el.textContent=left;el.classList.toggle('warn',left<=5);document.querySelectorAll('[data-timer]').forEach(t=>t.textContent=left);const mobileTimer=document.getElementById('mobile-timer');if(mobileTimer)mobileTimer.classList.toggle('warn',left<=5);if(shell){shell.style.setProperty('--p',pct.toFixed(2)+'%');shell.classList.toggle('warn',left<=5)}if(label)label.textContent=left<=0?'Süre doldu':left<=5?'Son saniyeler!':'Süre akıyor';}
function exportCsv(s){const fields=[['Sıra','Oyuncu','Takım','Puan','Doğru Sayısı'],...s.players.map(p=>[p.rank,p.name,p.team===null?'':`Takım ${p.team+1}`,p.score,p.correct])];const txt='\ufeff'+fields.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`sayi_kasifleri_sonuclar_${s.code}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);}
document.getElementById('sound-toggle').addEventListener('click',()=>{soundsOn=!soundsOn;const b=document.getElementById('sound-toggle');b.textContent=soundsOn?'🔊':'🔇';b.title=soundsOn?'Ses efektleri açık':'Ses efektleri kapalı';b.setAttribute('aria-label',soundsOn?'Ses efektlerini kapat':'Ses efektlerini aç');b.setAttribute('aria-pressed',String(soundsOn));if(soundsOn)playTone(640,.13)});
app.addEventListener('change',e=>{if(e.target.id==='custom-file')importTeacherFile(e.target)});
app.addEventListener('change',e=>{if(e.target.id==='invite-origin'){try{const u=new URL(e.target.value.trim());if(!['http:','https:'].includes(u.protocol))throw new Error();inviteOrigin=u.origin;error='';render();}catch{error='Bağlantı adresini http:// veya https:// ile girin.';render();}}});
app.addEventListener('click',async e=>{const button=e.target.closest('[data-click],[data-choice]');if(!button||!app.contains(button))return;
if(button.hasAttribute('data-choice')){if(serverState?.role==='player'&&!serverState.me?.answered)send({action:'answer',choice:Number(button.dataset.choice)});return;}
const type=button.dataset.click;
if(type==='custom-save'){addTeacherQuestion();return}
if(type==='custom-clear'){clearTeacherEditor();teacherMessage('Form temizlendi.');return}
if(type==='custom-edit'){openTeacherEditor(Number(button.dataset.index));return}
if(type==='custom-remove'){
 const i=Number(button.dataset.index);
 if(Number.isInteger(i)&&i>=0&&i<customQuestions.length&&confirm((i+1)+'. soruyu silmek istiyor musun?')){
  customQuestions.splice(i,1);saveTeacherQuestions();clearTeacherEditor();renderTeacherBank();teacherMessage('Soru silindi.');
 }return
}
if(type==='custom-template'){exportTeacherCsvExample();teacherMessage('CSV şablonu indirildi. Excel’de doldurup CSV olarak kaydedebilirsin.');return}
if(type==='custom-export'){
 if(!customQuestions.length){teacherMessage('Dışa aktarmak için önce soru ekle.');return}
 downloadTeacherText('sayi_kasifleri_sorularim.json',JSON.stringify(customQuestions,null,2),'application/json;charset=utf-8');
 teacherMessage('Soruların JSON dosyası olarak indirildi.');return
}
if(type==='back'||type==='home'){forget();if(ws&&ws.readyState===1)ws.close();ui='home';error='';render();history.replaceState(null,'',location.pathname);return;}
if(type==='setup'){ui='create';error='';render();return}
if(type==='join'){ui='join';error='';render();return}
if(type==='create'){
 const source=app.querySelector('#question-source')?.value==='custom'?'custom':'hazir';
 const config={mode:app.querySelector('#mode').value,category:app.querySelector('#category').value,
  count:Number(app.querySelector('#count').value),seconds:Number(app.querySelector('#seconds').value),
  teams:Number(app.querySelector('#teams').value),source};
 if(source==='custom'){
  if(!customQuestions.length){teacherMessage('⚠️ Önce en az bir soru ekle veya CSV / JSON dosyası yükle.');return}
  let questions;try{questions=customQuestions.map(validateTeacherQuestion)}catch(e){teacherMessage('⚠️ '+e.message);return}
  send({action:'create',config,questions});
 }else send({action:'create',config});
 button.disabled=true;return
}
if(type==='copy'){const url=joinUrl(serverState);try{await navigator.clipboard.writeText(url);button.textContent='✅ KOPYALANDI';}catch{prompt('Bağlantıyı kopyalayın:',url);}return}
if(type==='next'||type==='reveal'||type==='reset'||type==='end'){send({action:type});return}
if(type==='csv'&&serverState)exportCsv(serverState);
});
window.addEventListener('keydown',e=>{if(serverState?.role==='player'&&serverState.status==='question'&&!serverState.me?.answered&&/^[1-4]$/.test(e.key)&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName||'')){send({action:'answer',choice:Number(e.key)-1});}});
setInterval(updateTimer,150);
const saved=getStored();if(saved?.room&&saved?.secret&&saved?.role){room=saved.room;role=saved.role;secret=saved.secret;ui='room';}
else if(prefill)ui='join';
render();connect();
})();
</script></body></html>
