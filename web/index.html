<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101535">
<meta name="description" content="Sayı Kâşifleri Canlı: 6. sınıf matematik çarpanlar, katlar ve asal sayılar canlı bilgi yarışması.">
<title>Sayı Kâşifleri CANLI | 6. Sınıf Matematik</title>
<style>
:root{--navy:#0d112e;--panel:rgba(29,35,78,.92);--stroke:rgba(208,224,255,.17);--txt:#f9faff;--muted:#bfcaee;--mint:#5cf3d3;--yellow:#ffdb81;--lilac:#b8a5ff;--pink:#ff9abf;--red:#ff757f}*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{background:radial-gradient(ellipse at 12% 8%,#29225f 0%,transparent 40%),radial-gradient(ellipse at 93% 78%,#143958 0%,transparent 42%),#090e27;color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;margin:0;min-height:100vh}body:before{content:"";position:fixed;z-index:-1;inset:0;background-image:radial-gradient(#c8ceff 1px,transparent 1.6px);background-size:90px 90px;opacity:.13;pointer-events:none}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.42;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}a{color:var(--mint)}.shell{width:min(1090px,calc(100% - 32px));margin:0 auto}.head{height:86px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--stroke)}.logo{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--txt);font-weight:950;font-size:21px;letter-spacing:-.6px}.logo .mark{height:43px;width:43px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(130deg,var(--mint),var(--lilac));color:#121731;font-size:24px;box-shadow:0 9px 25px #02101977}.brand-sub{font-size:10px;letter-spacing:1.8px;color:var(--muted);font-weight:850}.status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:800;text-align:right}.dot{display:inline-block;width:9px;height:9px;flex:none;border-radius:100%;background:var(--red)}.dot.on{background:var(--mint);box-shadow:0 0 0 4px #5cf3d32b}.main{padding:22px 0 70px}.pill{display:inline-flex;gap:9px;align-items:center;padding:8px 14px;background:#252e62;border:1px solid #5960a7;border-radius:40px;color:var(--yellow);font-size:12px;letter-spacing:.8px;font-weight:900}.hero{display:grid;grid-template-columns:1.25fr .8fr;align-items:center;gap:36px;padding:54px 0 35px}.hero h1{font-size:clamp(42px,6.2vw,76px);line-height:1.02;letter-spacing:-2.9px;margin:20px 0 20px}.hero h1 span{background:linear-gradient(110deg,var(--yellow),var(--pink));background-clip:text;-webkit-text-fill-color:transparent}.hero p{font-size:18px;max-width:560px;line-height:1.7;color:var(--muted);margin:0}.hero-art{min-height:300px;display:grid;place-items:center;position:relative}.orbit{width:min(100%,330px);aspect-ratio:1;border:2px dashed #9eacff65;border-radius:50%;display:grid;place-items:center;transform:rotate(-13deg)}.planet{width:205px;aspect-ratio:1;border-radius:45px;background:linear-gradient(145deg,#5df0da,#a6a8ff 48%,#ffb2d1);box-shadow:0 0 0 18px #9eacff15,0 25px 80px #0a0a24;transform:rotate(13deg);display:grid;place-items:center;color:#15203f;font-size:100px;font-weight:950}.orb-label{position:absolute;background:#263265f5;padding:12px 16px;border:1px solid #8795df70;border-radius:15px;font-size:14px;font-weight:900;box-shadow:0 15px 25px #0004}.orb-label.l1{left:5%;top:10%;transform:rotate(-9deg)}.orb-label.l2{right:0;bottom:12%;transform:rotate(6deg)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card,.box{border:1px solid var(--stroke);border-radius:24px;background:var(--panel);box-shadow:0 24px 70px #0002}.card{min-height:285px;padding:28px;display:flex;flex-direction:column;align-items:flex-start}.card.live{background:linear-gradient(155deg,#3a2763dd,#241e55e9);border-color:#b28ef1a6}.card.join{background:linear-gradient(155deg,#133e53dd,#193e53e9);border-color:#69e5e3a0}.card-icon{font-size:50px}.card h2{font-size:23px;letter-spacing:-.5px;margin:15px 0 9px}.card p{color:#d2dafa;font-size:14px;line-height:1.6;margin:0 0 23px}.btn{border:0;border-radius:13px;font-weight:950;min-height:49px;padding:11px 21px;transition:filter .2s,transform .2s}.btn:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}.btn.main-btn{background:linear-gradient(110deg,var(--mint),#a8f6d8);color:#0d2f37}.btn.gold{background:linear-gradient(110deg,#ffe298,#ffb7bd);color:#33243c}.btn.dark{background:#30375f;color:#fff;border:1px solid #6a76ad}.btn.small{padding:8px 14px;min-height:40px;font-size:13px}.card .btn{margin-top:auto;width:100%}.foot{padding:20px 0;color:#96a5d4;font-size:12px;text-align:center}.section{width:min(820px,100%);margin:23px auto}.section.wide{width:100%}.back{border:0;background:transparent;color:var(--muted);font-weight:900;font-size:13px;padding:12px 2px;margin-bottom:15px}.box{padding:clamp(22px,4vw,43px)}.center{text-align:center}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:950;color:var(--mint);text-transform:uppercase}.title{font-size:clamp(27px,4vw,43px);letter-spacing:-.9px;margin:10px 0 12px;line-height:1.12}.subtitle{color:var(--muted);margin:0 0 25px;line-height:1.6}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.field label{display:block;font-size:13px;font-weight:850;color:#d4defb;margin:0 0 8px}.field input,.field select{width:100%;background:#101737;color:#fff;border:1px solid #566389;border-radius:12px;padding:13px 14px;min-height:50px}.field input::placeholder{color:#91a0ca}.hint{color:#94a2ce;font-size:12px;margin:7px 0 0}.wide-btn{width:100%;margin-top:20px;min-height:55px}.notice{border-radius:12px;padding:13px 16px;background:#3d2340;border:1px solid #f79db877;color:#ffdee5;font-size:13px;margin-bottom:18px}.message{color:#abf4e3;background:#163d47;border:1px solid #5edcc16c;border-radius:13px;padding:10px 13px;font-size:13px}.code{display:inline-block;font-size:clamp(42px,7vw,75px);font-weight:1000;letter-spacing:10px;color:var(--yellow);line-height:1.2;font-variant-numeric:tabular-nums}.live-top{display:flex;gap:18px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.room-title{margin:6px 0;font-size:clamp(25px,4vw,37px)}.badge{font-weight:900;font-size:12px;letter-spacing:.35px;color:var(--yellow);padding:8px 12px;background:#3a305b;border-radius:50px;display:inline-block}.lobby{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:23px}.qr-card{text-align:center;padding:20px;background:#131a3b;border-radius:19px;border:1px solid var(--stroke)}.qr-card img{width:195px;max-width:100%;aspect-ratio:1;border-radius:12px;background:#fff;margin:9px auto}.link{font-size:13px;word-break:break-all;color:#b5f4e8}.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid #7892c36e;background:#192853;border-radius:9px;padding:8px 12px;color:#e4ebff;font-size:12px;font-weight:850;margin:4px}.users{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0;min-height:54px}.user-pill{border-radius:50px;padding:9px 13px;color:#e9f2ff;background:#2b356c;border:1px solid #606fad63;font-size:13px;font-weight:850}.user-pill.off{opacity:.55}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.actions .btn{flex:1;white-space:nowrap}.progress-line{height:10px;overflow:hidden;background:#36416b;border-radius:100px;margin:20px 0}.progress-line>span{display:block;height:100%;border-radius:100px;background:linear-gradient(90deg,var(--mint),var(--yellow));transition:width .2s}.q-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:17px}.timer{min-width:75px;height:75px;border-radius:24px;display:grid;place-items:center;font-size:35px;font-weight:1000;color:#0c2439;background:var(--mint);font-variant-numeric:tabular-nums}.timer.warn{background:var(--red);color:#fff;animation:pulse 1s infinite}@keyframes pulse{50%{filter:brightness(1.4)}}.qtext{font-size:clamp(26px,4vw,44px);font-weight:950;letter-spacing:-.8px;text-align:center;margin:20px auto 24px;max-width:900px;line-height:1.23}.answers{display:grid;grid-template-columns:1fr 1fr;gap:13px}.answer{min-height:115px;padding:16px 21px;border:2px solid transparent;border-radius:18px;font-weight:900;font-size:clamp(16px,2vw,22px);color:#fff;text-align:left;display:flex;align-items:center;gap:16px;word-break:break-word;line-height:1.3;transition:transform .15s,opacity .15s}.answer .symbol{font-size:24px;width:36px;flex:none}.answer:nth-child(4n+1){background:#ba3751}.answer:nth-child(4n+2){background:#2164bc}.answer:nth-child(4n+3){background:#c18b19}.answer:nth-child(4n){background:#2c985e}.answer:disabled{opacity:.65}.answer.selected{border-color:#fff;box-shadow:0 0 0 4px #ffffff55;opacity:1}.answer.correct{border-color:#87ffd5;box-shadow:0 0 0 3px #b6fff28a;opacity:1}.answer.wrong{opacity:.43}.score-row{padding:14px 15px;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--stroke)}.score-row:last-child{border-bottom:0}.score-row.top{background:#7a623021;border-radius:12px}.medal{font-weight:1000;font-size:24px;width:38px;flex:none;text-align:center}.score-name{font-size:16px;font-weight:950;flex:1;min-width:0;overflow-wrap:anywhere}.score-name small{font-size:12px;color:var(--muted);display:block;font-weight:600;margin-top:2px}.points{font-size:21px;font-weight:1000;color:var(--yellow);font-variant-numeric:tabular-nums}.two-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}.inner{border-radius:18px;border:1px solid var(--stroke);background:#121b3e;padding:17px}.inner h3{margin:3px 0 13px}.big-emoji{font-size:66px;display:block;margin:8px}.result-summary{background:#173c49;border:1px solid #65dec6aa;border-radius:16px;padding:18px;margin:22px 0;color:#d7fff8}.result-summary.err{background:#442740;border-color:#ff7c99a3;color:#ffe3ed}.small-muted{font-size:13px;color:var(--muted);line-height:1.6}.waiting-icon{font-size:70px;margin:18px}.answer-info{font-size:18px;font-weight:800;text-align:center;padding:25px 15px}.countline{font-size:12px;color:var(--muted)}.stat-grid{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin:22px 0}.stat-grid .tag{padding:13px 16px;font-size:13px}.team-color{display:inline-block;width:12px;height:12px;border-radius:100%;margin-right:4px;background:var(--mint)}.team-color.t1{background:var(--yellow)}.team-color.t2{background:var(--pink)}.team-color.t3{background:var(--lilac)}@media(max-width:760px){.hero{grid-template-columns:1fr;padding:36px 0 23px}.hero-art{display:none}.grid{grid-template-columns:1fr}.card{min-height:220px}.lobby,.two-cols{grid-template-columns:1fr}.status{font-size:11px}.head{height:76px}}@media(max-width:520px){.logo{font-size:16px}.logo .mark{width:37px;height:37px;font-size:20px}.brand-sub{font-size:9px}.hero h1{font-size:46px}.fields{grid-template-columns:1fr}.answers{gap:9px}.answer{min-height:124px;padding:12px 11px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-size:16px;border-radius:14px}.answer .symbol{font-size:20px}.box{padding:19px 14px}.qtext{font-size:27px}.timer{height:60px;min-width:60px;font-size:27px;border-radius:18px}.code{font-size:48px;letter-spacing:6px}.actions .btn{width:100%;flex:auto}.tag{font-size:11px}.score-row{gap:9px;padding:12px 5px}.score-name{font-size:14px}.points{font-size:17px}}
</style></head>
<body><div class="shell"><header class="head"><a class="logo" href="/" title="Sayı Kâşifleri Ana Sayfa"><span class="mark">✦</span><span><span style="display:block">SAYI KÂŞİFLERİ <span style="color:var(--mint)">CANLI</span></span><span class="brand-sub">DOĞA KOLEJİ • 6. SINIF MATEMATİK</span></span></a><span class="status"><span id="connection-dot" class="dot"></span><span id="connection-text">Bağlanıyor...</span></span></header><main id="app" class="main" aria-live="polite"></main><footer class="foot">✦ Çarpanlar • Katlar • Asal Sayılar &nbsp;|&nbsp; Eğitim amaçlı sınıf yarışması</footer></div>
<script>
(()=>{
'use strict';
const app=document.getElementById('app');
let ws,online=false,ui='home',room=null,role=null,secret=null,serverState=null,error='',toast='',connDelay=1000,clockSkew=0,inviteOrigin=location.origin;
const qs=new URLSearchParams(location.search),prefill=(qs.get('kod')||'').replace(/\D/g,'').slice(0,6);
const ESC=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('tr-TR').format(n||0);
const modeLabel=c=>c.mode==='takim'?'Takımlar Yarışıyor':'Herkes Bireysel Yarışıyor';
const categoryLabel=c=>({karisik:'Karışık Konular',carpan:'Çarpanlar',kat:'Katlar',asal:'Asal Sayılar'})[c.category]||'Karışık';
const medal=r=>r===1?'🥇':r===2?'🥈':r===3?'🥉':`${r}.`;
const symbols=['▲','◆','●','■'];
function getStored(){try {return JSON.parse(sessionStorage.getItem('sk_canli_session')||'null');}catch{return null}}
function saveStored(){try{sessionStorage.setItem('sk_canli_session',JSON.stringify({room,role,secret}));}catch{}}
function forget(){try{sessionStorage.removeItem('sk_canli_session');}catch{}room=role=secret=serverState=null;}
function connect(){
  const proto=location.protocol==='https:'?'wss:':'ws:';
  ws=new WebSocket(`${proto}//${location.host}/ws`);
  ws.addEventListener('open',()=>{online=true;connDelay=1000;connStatus();if(room&&secret&&role)send({action:role==='host'?'host_resume':'resume',code:room,token:secret});});
  ws.addEventListener('close',()=>{online=false;connStatus();setTimeout(connect,connDelay);connDelay=Math.min(12000,connDelay*1.5);});
  ws.addEventListener('error',()=>{online=false;connStatus();});
  ws.addEventListener('message',ev=>{
   let v;try{v=JSON.parse(ev.data)}catch{return}
   if(v.type==='error'){error=v.message||'Bir sorun oluştu.';render();return}
   if(v.type==='notice'){error=v.text;render();return}
   if(v.type==='created'||v.type==='joined'){
     room=v.code;secret=v.token;role=v.type==='created'?'host':'player';ui='room';error='';saveStored();return;
   }
   if(v.type==='state'){clockSkew=Date.now()-(v.serverNow||Date.now());serverState=v;role=v.role;room=v.code;ui='room';error='';render();}
  });
}
function connStatus(){document.getElementById('connection-dot').className='dot'+(online?' on':'');document.getElementById('connection-text').textContent=online?'Sunucuya bağlı':'Bağlantı bekleniyor';const create=app.querySelector('[data-click=create]');const join=app.querySelector('#join-form button[type=submit]');if(create)create.disabled=!online;if(join)join.disabled=!online;}
function send(obj){if(!ws||ws.readyState!==1){error='Bağlantı kesildi. İnternet veya Wi-Fi ağını kontrol edin.';render();return;}ws.send(JSON.stringify(obj));}
function alertHTML(){return error?`<div class="notice" role="alert">⚠️ ${ESC(error)}</div>`:''}
function nav(){return `<button class="back" data-click="back">← Ana sayfa</button>`}
function renderHome(){
app.innerHTML=`<section class="hero"><div><span class="pill">⚡ GERÇEK ZAMANLI SINIF YARIŞMASI</span><h1>Sayıların<br><span>Yıldızı Sen Ol!</span></h1><p>Öğretmenin tahtadan başlattığı yarışmaya kendi telefonundan katıl. Herkes aynı anda cevaplasın, en hızlı doğrular puanları toplasın!</p><div class="stat-grid" style="justify-content:flex-start"><span class="tag">📚 56 soru</span><span class="tag">🏆 Canlı sıralama</span><span class="tag">📱 Telefonla katılım</span></div></div><div class="hero-art"><div class="orbit"><div class="planet">∑</div></div><span class="orb-label l1">🪐 Çarpanlar</span><span class="orb-label l2">🚀 Asal Sayılar</span></div></section>
${alertHTML()}<div class="grid">
<article class="card live"><span class="card-icon">🎤</span><h2>Öğretmen: Canlı Oda</h2><p>Yarışmayı kur, 6 haneli PIN ve QR kod göster, bütün sınıfı aynı anda yarıştır.</p><button class="btn gold" data-click="setup">🎮 CANLI YARIŞMA KUR</button></article>
<article class="card join"><span class="card-icon">📲</span><h2>Öğrenci: Oyuna Katıl</h2><p>Öğretmeninin verdiği PIN kodunu ve rumuzunu yaz. Telefonundan canlı yarışmaya gir.</p><button class="btn main-btn" data-click="join">🔑 PIN İLE KATIL</button></article>
<article class="card"><span class="card-icon">🪐</span><h2>Bireysel Macera</h2><p>Canlı oda gerektirmez. Çarpanlar, katlar ve asal sayılar bölümlerini kendi hızında oyna.</p><a class="btn dark" href="/klasik" style="display:grid;place-items:center;text-decoration:none">🚀 TEK BAŞIMA OYNA</a></article>
</div>`;
}
function renderSetup(){app.innerHTML=`<section class="section">${nav()}<div class="box">${alertHTML()}<div class="eyebrow">🎤 ÖĞRETMEN KONTROL PANELİ</div><h1 class="title">Canlı yarışmayı ayarla</h1><p class="subtitle">Odayı açtığında sınıftaki öğrenciler, ekranda gözükecek PIN veya QR koduyla katılabilir.</p>
<div class="fields">
<div class="field"><label for="mode">Yarışma biçimi</label><select id="mode"><option value="bireysel">🏆 Bireysel rekabet</option><option value="takim">🤝 Takımlar arası rekabet</option></select></div>
<div class="field"><label for="category">Konu</label><select id="category"><option value="karisik">🎲 Üç konudan karışık</option><option value="carpan">🪐 Çarpanlar</option><option value="kat">🚀 Katlar</option><option value="asal">💎 Asal Sayılar</option></select></div>
<div class="field"><label for="count">Soru sayısı</label><select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div>
<div class="field"><label for="seconds">Soru başına süre</label><select id="seconds"><option>15</option><option selected>20</option><option>30</option><option>45</option></select></div>
<div class="field" id="team-field" style="display:none"><label for="teams">Takım sayısı</label><select id="teams"><option value="2">2 takım</option><option value="3">3 takım</option><option value="4">4 takım</option></select></div></div>
<button class="btn gold wide-btn" data-click="create" ${online?'':'disabled'}>🚀 ODAYI AÇ VE PIN OLUŞTUR</button><p class="small-muted center">Odanın açılması için internet erişimi veya sınıf içi aynı Wi-Fi ağında çalışan bir sunucu gerekir.</p></div></section>`;
app.querySelector('#mode').addEventListener('change',ev=>{app.querySelector('#team-field').style.display=ev.target.value==='takim'?'block':'none';});}
function renderJoin(){app.innerHTML=`<section class="section" style="max-width:520px">${nav()}<div class="box center">${alertHTML()}<span class="big-emoji">📱</span><div class="eyebrow">ÖĞRENCİ GİRİŞİ</div><h1 class="title">Yarışmaya Katıl!</h1><p class="subtitle">Tahtadaki 6 haneli PIN'i yaz, ardından kendine bir rumuz seç.</p><form id="join-form" style="text-align:left"><div class="field"><label for="pin">6 haneli yarışma PIN'i</label><input id="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="123456" value="${ESC(prefill)}" autocomplete="one-time-code"></div><div class="field" style="margin-top:17px"><label for="nickname">Rumuzun (gerçek adın gerekli değil)</label><input id="nickname" maxlength="24" minlength="2" required placeholder="Örn. Matematik Yıldızı" autocomplete="nickname"></div><button type="submit" class="btn main-btn wide-btn" ${online?'':'disabled'}>✨ OYUNA KATIL</button></form><p class="small-muted">Her öğrenci kendi telefonundan girer. Öğretmenin soruyu başlatmasını bekle.</p></div></section>`;
app.querySelector('#join-form').addEventListener('submit',e=>{e.preventDefault();error='';send({action:'join',code:app.querySelector('#pin').value.replace(/\D/g,''),name:app.querySelector('#nickname').value.trim()});});}
function scoresTable(s,limit=60){return s.players.slice(0,limit).map(p=>`<div class="score-row ${p.rank===1?'top':''}"><span class="medal">${medal(p.rank)}</span><span class="score-name">${ESC(p.name)} ${p.online?'':'<small>Bağlantı kesildi</small>'}<small>${p.correct} doğru</small></span><span class="points">${fmt(p.score)}</span></div>`).join('')||'<p class="small-muted center">Henüz oyuncu yok.</p>'}
function teamsTable(s){return s.teams.map((t,i)=>`<div class="score-row ${i===0?'top':''}"><span class="medal">${medal(i+1)}</span><span class="score-name"><span class="team-color t${t.team}"></span>${ESC(t.name)}<small>${t.players} oyuncu · ${t.correct} doğru</small></span><span class="points">${fmt(t.score)}</span></div>`).join('')}
function roomHeader(s){const c=s.config;return `<div class="live-top"><div><div class="eyebrow">⚡ SAYI KÂŞİFLERİ • CANLI</div><h1 class="room-title">${s.status==='lobby'?'Yarışma Lobisi':s.status==='finished'?'Büyük Final':s.status==='reveal'?'Doğru Cevap Açıklandı':'Yarışma Başladı!'}</h1><span class="badge">${ESC(modeLabel(c))}</span> <span class="badge">${ESC(categoryLabel(c))}</span></div><div style="text-align:right"><div class="countline">ODA PIN</div><div class="code" style="font-size:32px;letter-spacing:4px">${ESC(s.code)}</div><div class="countline">👥 ${s.onlineCount}/${s.playerCount} çevrimiçi</div></div></div>`}
function joinUrl(s){return `${inviteOrigin}/?kod=${encodeURIComponent(s.code)}`}
function lobbyTeacher(s){const url=joinUrl(s);
const localHost = ['localhost','127.0.0.1'].includes(location.hostname) || /^(192\.168\.|10\.|172\.(1[6-9]|2[0-9]|3[01])\.)/.test(location.hostname);
const addressNote = localHost ? `<div class="notice" style="margin-top:16px">⚠️ Yerel ağ adresi telefonların mobil internetinden açılamaz. Her ağdan katılmak için oyunu internette yayımlayın.</div><div class="field" style="margin-top:14px"><label for="invite-origin">📡 Öğrencilerin kullanacağı site adresi (gerekirse düzeltin)</label><input id="invite-origin" value="${ESC(inviteOrigin)}" placeholder="https://oyun-adresi.onrender.com"></div>` : `<div class="message" style="margin-top:16px">🌍 Canlı internet bağlantısı hazır! Öğrenciler aynı Wi-Fi'de olmak zorunda değil; telefonlarının mobil internetiyle de QR kodunu okutup katılabilir.</div>`;
return `<div class="box">${roomHeader(s)}${addressNote}<div class="lobby"><div class="qr-card"><div class="eyebrow">📱 ÖĞRENCİLER BU KODU OKUTSUN</div><img src="/qr.png?url=${encodeURIComponent(url)}" alt="Öğrenci giriş QR kodu"><div class="code">${ESC(s.code)}</div><p class="small-muted">PIN'i tahtada göster, herkes kendi cihazından katılsın.</p><div class="link">${ESC(url)}</div><button class="btn dark small" data-click="copy" style="margin:13px auto 0">🔗 GİRİŞ LİNKİNİ KOPYALA</button></div><div class="inner"><div class="eyebrow">👥 KATILANLAR (${s.playerCount})</div><div class="users">${s.players.map(p=>`<span class="user-pill ${p.online?'':'off'}">${ESC(p.name)}</span>`).join('')||'<span class="small-muted">Oyuncular bekleniyor...</span>'}</div><div class="message">✅ Katılım açık · ${s.config.count} soru · Soru başına ${s.config.seconds} saniye</div><button class="btn gold wide-btn" data-click="next" ${s.playerCount&&online?'':'disabled'}>🎬 YARIŞMAYI BAŞLAT</button></div></div></div>`}
function lobbyStudent(s){const me=s.me||{};const myteam=s.teams.find(t=>t.team===me.team);return `<div class="box center">${roomHeader(s)}<span class="big-emoji">🎉</span><h2 class="title">Hoş geldin, ${ESC(me.name||'Kâşif')}!</h2><p class="subtitle">Katılım başarılı! Öğretmenin yarışmayı başlatacak. Hazır ol!</p>${myteam?`<div class="message">🤝 Takımın: <strong>${ESC(myteam.name)}</strong></div>`:''}<div class="stat-grid"><span class="tag">👥 ${s.playerCount} oyuncu</span><span class="tag">🧠 ${s.config.count} soru</span><span class="tag">⏱️ ${s.config.seconds} sn / soru</span></div><div class="waiting-icon">⏳</div><p class="small-muted">Bu sayfayı kapatma; sorular başlayınca otomatik gelecek.</p></div>`}
function answerOptions(s){const q=s.question,me=s.me,answered=me?.answered,reveal=s.status==='reveal';return `<div class="answers">${q.options.map((o,i)=>`<button class="answer ${reveal?(i===q.correct?'correct':'wrong'):''} ${answered&&me.choice===i?'selected':''}" ${reveal||s.role==='host'||answered?'disabled':''} data-choice="${i}"><span class="symbol">${symbols[i]}</span><span>${ESC(o)}</span></button>`).join('')}</div>`}
function teacherQuestion(s){const q=s.question;const reveal=s.status==='reveal';return `<div class="box">${roomHeader(s)}<div class="q-head" style="margin-top:24px"><span class="badge">🎯 Soru ${q.number} / ${q.total}</span>${reveal?'<span class="badge">✅ CEVAP AÇIKLANDI</span>':`<div class="timer" id="timer">${s.config.seconds}</div>`}<span class="badge">📲 ${s.answerCount} / ${s.playerCount} cevap</span></div><div class="progress-line"><span style="width:${Math.round(100*(q.number-1)/q.total)}%"></span></div><h2 class="qtext">${ESC(q.text)}</h2>${answerOptions(s)}${reveal?`<div class="result-summary">✅ <strong>${ESC(q.options[q.correct])}</strong><div class="small-muted" style="color:inherit;margin-top:8px">${ESC(q.explain)}</div></div><div class="${s.config.mode==='takim'?'two-cols':''}"><div class="inner"><h3>🏆 Anlık Sıralama</h3>${scoresTable(s,7)}</div>${s.config.mode==='takim'?`<div class="inner"><h3>🤝 Takım Puanları</h3>${teamsTable(s)}</div>`:''}</div>`:`<div class="answer-info" style="color:var(--muted)">📱 Öğrenciler telefonlarından cevaplıyor...</div>`}<div class="actions">${reveal?`<button class="btn gold" data-click="next">${q.number===q.total?'🏆 SONUÇLARI GÖSTER':'➡️ SONRAKİ SORU'}</button>`:'<button class="btn dark" data-click="reveal">🔍 CEVABI GÖSTER</button>'}<button class="btn dark" data-click="end">🏁 YARIŞMAYI BİTİR</button></div></div></div>`}
function studentQuestion(s){const q=s.question,me=s.me||{},reveal=s.status==='reveal';const myteam=s.teams.find(t=>t.team===me.team);let top='';if(reveal){const correct=me.answered&&me.choice===q.correct;top=`<div class="result-summary ${correct?'':'err'}">${correct?'🌟 Harika! Doğru cevap. +'+fmt(me.earned)+' puan':`📚 ${me.answered?'Bu kez olmadı.':'Süre doldu.'} Doğru cevap: ${ESC(q.options[q.correct])}`}<div class="small-muted" style="color:inherit;margin-top:8px">${ESC(q.explain)}</div></div>`}
else if(me.answered)top='<div class="result-summary center">✅ Cevabın kaydedildi! Diğer oyuncular bekleniyor...</div>';
return `<div class="box">${roomHeader(s)}<div class="q-head" style="margin-top:24px"><span class="badge">🎯 Soru ${q.number} / ${q.total}</span>${reveal?'<span class="badge">📣 SONUÇ</span>':`<div class="timer" id="timer">${s.config.seconds}</div>`}<span class="badge">⭐ ${fmt(me.score)} puan</span></div><div class="progress-line"><span style="width:${Math.round(100*(q.number-1)/q.total)}%"></span></div><h2 class="qtext">${ESC(q.text)}</h2>${answerOptions(s)}${top}${reveal?`<div class="center small-muted">Öğretmen bir sonraki soruyu başlatacak.</div><div class="inner" style="margin-top:18px"><h3>🏆 Anlık Sıralama</h3>${scoresTable(s,5)}</div>`:me.answered?'':`<p class="small-muted center">Hızlı ve doğru cevapla: 1000 puan + en fazla 500 hız bonusu!</p>`}${myteam?`<p class="small-muted center">🤝 ${ESC(myteam.name)}</p>`:''}</div>`}
function finalScreen(s){const leader=s.players[0],mine=s.me,myRank=mine?s.players.find(p=>p.name===mine.name)?.rank:null;return `<div class="box">${roomHeader(s)}<div class="center"><span class="big-emoji">🏆</span><h2 class="title">${s.config.mode==='takim'?'Kazanan Takım Belli!':'Matematik Şampiyonları!'}</h2><p class="subtitle">${s.config.count} soru tamamlandı. Bütün yarışmacılarımızı tebrik ediyoruz!</p>${mine?`<div class="message">${ESC(mine.name)} · ${myRank}. sıra · <strong>${fmt(mine.score)} puan</strong></div>`:''}</div><div class="${s.config.mode==='takim'?'two-cols':''}" style="margin-top:18px"><div class="inner"><h3>🥇 Bireysel Sıralama</h3>${scoresTable(s)}</div>${s.config.mode==='takim'?`<div class="inner"><h3>🤝 Takım Sıralaması</h3>${teamsTable(s)}</div>`:''}</div>${s.role==='host'?`<div class="actions"><button class="btn gold" data-click="reset">🔄 YENİDEN OYNA</button><button class="btn dark" data-click="csv">📊 SONUÇLARI CSV AL</button><button class="btn dark" data-click="home">🏠 ANA SAYFA</button></div>`:'<p class="small-muted center">Yeniden oynamak için öğretmeninin yeni tur başlatmasını bekle.</p>'}</div>`}
function renderRoom(s){if(s.status==='lobby')app.innerHTML=`<section class="section wide">${s.role==='host'?lobbyTeacher(s):lobbyStudent(s)}</section>`;
else if(s.status==='question'||s.status==='reveal')app.innerHTML=`<section class="section wide">${s.role==='host'?teacherQuestion(s):studentQuestion(s)}</section>`;
else app.innerHTML=`<section class="section wide">${finalScreen(s)}</section>`;
if(error)app.insertAdjacentHTML('afterbegin',alertHTML());
updateTimer();}
function render(){if(ui==='home')renderHome();else if(ui==='create')renderSetup();else if(ui==='join')renderJoin();else if(serverState)renderRoom(serverState);else {ui='home';renderHome();}}
function updateTimer(){if(!serverState||serverState.status!=='question'||!serverState.question)return;const el=document.getElementById('timer');if(!el)return;const left=Math.max(0,Math.ceil((serverState.question.deadline-(Date.now()-clockSkew))/1000));el.textContent=left;el.classList.toggle('warn',left<=5);}
function exportCsv(s){const fields=[['Sıra','Oyuncu','Takım','Puan','Doğru Sayısı'],...s.players.map(p=>[p.rank,p.name,p.team===null?'':`Takım ${p.team+1}`,p.score,p.correct])];const txt='\ufeff'+fields.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`sayi_kasifleri_sonuclar_${s.code}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);}
app.addEventListener('change',e=>{if(e.target.id==='invite-origin'){try{const u=new URL(e.target.value.trim());if(!['http:','https:'].includes(u.protocol))throw new Error();inviteOrigin=u.origin;error='';render();}catch{error='Bağlantı adresini http:// veya https:// ile girin.';render();}}});
app.addEventListener('click',async e=>{const button=e.target.closest('[data-click],[data-choice]');if(!button||!app.contains(button))return;
if(button.hasAttribute('data-choice')){if(serverState?.role==='player'&&!serverState.me?.answered)send({action:'answer',choice:Number(button.dataset.choice)});return;}
const type=button.dataset.click;
if(type==='back'||type==='home'){forget();if(ws&&ws.readyState===1)ws.close();ui='home';error='';render();history.replaceState(null,'',location.pathname);return;}
if(type==='setup'){ui='create';error='';render();return}
if(type==='join'){ui='join';error='';render();return}
if(type==='create'){const config={mode:app.querySelector('#mode').value,category:app.querySelector('#category').value,count:Number(app.querySelector('#count').value),seconds:Number(app.querySelector('#seconds').value),teams:Number(app.querySelector('#teams').value)};send({action:'create',config});button.disabled=true;return}
if(type==='copy'){const url=joinUrl(serverState);try{await navigator.clipboard.writeText(url);button.textContent='✅ KOPYALANDI';}catch{prompt('Bağlantıyı kopyalayın:',url);}return}
if(type==='next'||type==='reveal'||type==='reset'||type==='end'){send({action:type});return}
if(type==='csv'&&serverState)exportCsv(serverState);
});
window.addEventListener('keydown',e=>{if(serverState?.role==='player'&&serverState.status==='question'&&!serverState.me?.answered&&/^[1-4]$/.test(e.key)&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName||'')){send({action:'answer',choice:Number(e.key)-1});}});
setInterval(updateTimer,150);
const saved=getStored();if(saved?.room&&saved?.secret&&saved?.role){room=saved.room;role=saved.role;secret=saved.secret;ui='room';}
else if(prefill)ui='join';
render();connect();
})();
</script></body></html>
